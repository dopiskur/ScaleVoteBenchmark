<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScaleTrigger — Live Results</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --border:         rgba(11,11,11,0.10);
    --series-yes:     #2a78d6;
    --series-no:      #eb6834;
    --critical:       #d03b3b;
    --critical-wash:  rgba(208,59,59,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --border:         rgba(255,255,255,0.10);
      --series-yes:     #3987e5;
      --series-no:      #d95926;
      --critical:       #e66767;
      --critical-wash:  rgba(230,103,103,0.12);
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --border:         rgba(255,255,255,0.10);
    --series-yes:     #3987e5;
    --series-no:      #d95926;
    --critical:       #e66767;
    --critical-wash:  rgba(230,103,103,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }

  .viz-root {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 40px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 28px;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .tiles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .tile-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex: none;
  }

  .swatch--yes { background: var(--series-yes); }
  .swatch--no  { background: var(--series-no); }

  .tile-value {
    font-size: 40px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: proportional-nums;
    color: #ffffff;
  }

  .bar {
    display: flex;
    height: 24px;
    border-radius: 4px;
    overflow: hidden;
    background: var(--border);
  }

  .bar-segment {
    height: 100%;
    transition: width 0.4s ease;
  }

  .bar-segment--yes { background: var(--series-yes); }
  .bar-segment--no  { background: var(--series-no); }
  .bar-gap { width: 2px; background: var(--surface-1); flex: none; }

  .meta {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .payload {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .status {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-muted);
    min-height: 16px;
  }

  .cleanup-btn {
    margin-top: 20px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--critical);
    background: transparent;
    border: 1px solid var(--critical);
    border-radius: 6px;
    cursor: pointer;
  }

  .cleanup-btn:hover {
    background: var(--critical-wash);
  }
</style>
</head>
<body>
  <div class="viz-root">
    <h1>ScaleTrigger</h1>
    <p class="subtitle">Live voting results</p>

    <div class="card">
      <div class="tiles">
        <div>
          <div class="tile-label"><span class="swatch swatch--yes"></span>Yes</div>
          <div class="tile-value" id="yes-percent">—</div>
        </div>
        <div>
          <div class="tile-label"><span class="swatch swatch--no"></span>No</div>
          <div class="tile-value" id="no-percent">—</div>
        </div>
      </div>

      <div class="bar">
        <div class="bar-segment bar-segment--yes" id="bar-yes"></div>
        <div class="bar-gap"></div>
        <div class="bar-segment bar-segment--no" id="bar-no"></div>
      </div>

      <div class="meta">
        <span id="total">Total votes: —</span>
        <span id="updated">—</span>
      </div>
      <div class="payload" id="payload">Payload table: —</div>
    </div>

    <p class="status" id="status">Loading…</p>

    <button class="cleanup-btn" id="cleanup-btn" type="button">Database cleanup</button>
  </div>

  <script>
    const yesPercentEl = document.getElementById('yes-percent');
    const noPercentEl = document.getElementById('no-percent');
    const barYesEl = document.getElementById('bar-yes');
    const barNoEl = document.getElementById('bar-no');
    const totalEl = document.getElementById('total');
    const updatedEl = document.getElementById('updated');
    const payloadEl = document.getElementById('payload');
    const statusEl = document.getElementById('status');
    const cleanupBtn = document.getElementById('cleanup-btn');

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return bytes + ' B';
      }
      if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB';
      }
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    async function refresh() {
      try {
        const response = await fetch('/api/vote/report', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        const report = await response.json();

        const yesPercent = report.yesPercent ?? 0;
        const noPercent = report.noPercent ?? 0;
        const payloadCount = report.payloadCount ?? 0;
        const payloadBytes = report.payloadTotalBytes ?? 0;

        yesPercentEl.textContent = yesPercent + '%';
        noPercentEl.textContent = noPercent + '%';
        barYesEl.style.width = yesPercent + '%';
        barNoEl.style.width = noPercent + '%';
        totalEl.textContent = 'Total votes: ' + (report.total ?? 0);
        updatedEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
        payloadEl.textContent = 'Payload table: ' + payloadCount +
          (payloadCount === 1 ? ' row, ' : ' rows, ') + formatBytes(payloadBytes);
        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = 'Could not load results (' + err.message + ').';
      }
    }

    cleanupBtn.addEventListener('click', async () => {
      if (!confirm('This permanently deletes all vote and payload data. Continue?')) {
        return;
      }

      const username = prompt('Admin username:');
      if (username === null) {
        return;
      }
      const password = prompt('Admin password:');
      if (password === null) {
        return;
      }

      try {
        statusEl.textContent = 'Logging in…';
        const loginResponse = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (!loginResponse.ok) {
          throw new Error('login failed (HTTP ' + loginResponse.status + ')');
        }
        const { token } = await loginResponse.json();

        statusEl.textContent = 'Cleaning up…';
        const cleanupResponse = await fetch('/api/vote/cleanup', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!cleanupResponse.ok) {
          throw new Error('cleanup failed (HTTP ' + cleanupResponse.status + ')');
        }

        statusEl.textContent = 'Database cleaned up.';
        await refresh();
      } catch (err) {
        statusEl.textContent = 'Cleanup failed (' + err.message + ').';
      }
    });

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
